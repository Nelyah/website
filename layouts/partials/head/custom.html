{{ if eq .Section "short-stories" }}
    {{ $css := resources.Get "css/short-stories.css" | resources.Minify | resources.Fingerprint }}
    <link rel="preload" as="style" href="{{ $css.RelPermalink }}">
    <link rel="stylesheet" href="{{ $css.RelPermalink }}">
{{ end }}

{{ with .Site.Params.favicon }}
    <link rel="icon" type="image/png" href="{{ . | relURL }}">
    <link rel="apple-touch-icon" href="{{ . | relURL }}">
{{ end }}
