baseURL = "https://chloe.dequeker.me"
languageCode = "en-gb"
title = "Chloé Dequeker"
theme = "hugo-theme-stack"

[taxonomies]
  countries = "countries"
  category  = "categories"
  tag       = "tags"

[params]
  description = "foo bar"
  featuredImageField = "featured_image"
  mainSections = ["wheeling-the-world", "short-stories"]
  favicon = "favicon.png"

  [params.sidebar]
    compact = false

  [[params.widgets.page]]
    type = "continents"

  [[params.widgets.page]]
    type = "tag-countries"
    params.limit = 50

  [[params.widgets.page]]
    type = "toc"

#   [[params.widgets.page]]
#     type = "search"
#   [[params.widgets.homepage]]
#     type = "search"

  [[params.widgets.homepage]]
    type = "continents"

  [[params.widgets.homepage]]
    type = "tag-countries"
    params.limit = 50

[[params.widgets.homepage]]
  type  = "archivesByMonth"
  title = "Archives by Month"

[[params.widgets.page]]
  type  = "archivesByMonth"
  title = "Archives by Month"

# This allows to have regular line breaks in markdown to be rendered as an actual line break
# on the website
[markup]
  [markup.goldmark.renderer]
    hardWraps = true

[menu]
  [[menu.social]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/Nelyah"
    [menu.social.params]
    icon = "brand-github"

  [[menu.social]]
    identifier = "linkedin"
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/%F0%9F%8E%BB-chlo%C3%A9-dequeker-b18b55a2/"
    [menu.social.params]
    icon = "brand-linkedin"

  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = -1
    [menu.main.params]
        icon = "home"
        newTab = false

  [[menu.main]]
    identifier = "wheeling-the-world"
    name = "Wheeling the world"
    url = "/wheeling-the-world/"
    weight = 1
    [menu.main.params]
        icon = "bike"
        newTab = false

  [[menu.main]]
    identifier = "short-stories"
    name = "Short stories"
    url = "/short-stories/"
    weight = 2
    [menu.main.params]
        icon = "vocabulary"
        newTab = false

  [[menu.main]]
    identifier = "about"
    name = "About me"
    url = "/about/"
    weight = 3
    [menu.main.params]
        icon = "file-info"
        newTab = false

  [[menu.main]]
    identifier = "hikes-and-travels"
    name = "Where I've hiked"
    url = "/hikes-and-travels/"
    weight = 4
    [menu.main.params]
        icon = "map"
        newTab = false


[params.hugoLeaflet]

# Run this to get the integrity hash
# curl -sS https://unpkg.com/@raruto/leaflet-elevation@2.5.2/dist/leaflet-elevation.css \
#  | openssl dgst -sha256 -binary | openssl base64 -A \
#  | sed 's/^/sha256-/'

  [[params.hugoLeaflet.css]]
    href        = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin = ""
    [params.hugoLeaflet.css.params]
      integrity = "sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="

  [[params.hugoLeaflet.js]]
    src         = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin = ""
    [params.hugoLeaflet.js.params]
      integrity = "sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="

  [[params.hugoLeaflet.css]]
    href = "https://unpkg.com/@raruto/leaflet-elevation@2.5.2/dist/leaflet-elevation.css"
    [params.hugoLeaflet.css.params]
      integrity = "sha256-Rno32KzOPxXAIrNHO5LLmpd+7FJOgJyNJbO2jvEqxBk="

  [[params.hugoLeaflet.js]]
    src = "https://unpkg.com/@raruto/leaflet-elevation@2.5.2/dist/leaflet-elevation.js"
    [params.hugoLeaflet.js.params]
      integrity = "sha256-6Rs5Nhn4lbKn19pJ8SM67PydcL19Eh6lQV4PfifUOgw="

  [[params.hugoLeaflet.js]]
