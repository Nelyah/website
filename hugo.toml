baseURL = "https://chloe.dequeker.me"
languageCode = "en-gb"
title = "Chloé Dequeker"
theme = "hugo-theme-stack"

[taxonomies]
  countries = "countries"
  category  = "categories"
  tag       = "tags"

[params]
  description = "foo bar"
  featuredImageField = "featured_image"
  mainSections = ["wheeling-the-world", "short-stories"]

  [params.sidebar]
    compact = false

  [[params.widgets.page]]
    type = "continents"

  [[params.widgets.page]]
    type = "tag-countries"
    params.limit = 50

  [[params.widgets.page]]
    type = "toc"

#   [[params.widgets.page]]
#     type = "search"
#   [[params.widgets.homepage]]
#     type = "search"

  [[params.widgets.homepage]]
    type = "continents"

  [[params.widgets.homepage]]
    type = "tag-countries"
    params.limit = 50

[[params.widgets.homepage]]
  type  = "archivesByMonth"
  title = "Archives by Month"

[[params.widgets.page]]
  type  = "archivesByMonth"
  title = "Archives by Month"

# This allows to have regular line breaks in markdown to be rendered as an actual line break
# on the website
[markup]
  [markup.goldmark.renderer]
    hardWraps = true

